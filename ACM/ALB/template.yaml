AWSTemplateFormatVersion: "2010-09-09"

Parameters:

  VPCID:
    Type: String
    Default: vpc-08222c8102316eedc

  Subnets:
    Type: CommaDelimitedList
    Default: "subnet-0a26a20eb58f71604,subnet-0e91adc4a421dd678"

  ImageID:
    Type: String
    Default: ami-0b79f6b294a030f24

  InstanceType:
    Type: String
    Default: t3.micro

  sg:
    Type: String
    Default: sg-0661526b7d09978ad


Resources:

  MyCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: mydomain.org
      ValidationMethod: DNS


  MyWebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageID
      InstanceType: !Ref InstanceType
      SubnetId: !Select [0, !Ref Subnets]
      SecurityGroupIds:
        - !Ref sg

      UserData:
        Fn::Base64: |
          #!/bin/bash

          yum update -y
          yum install -y httpd

          systemctl enable httpd
          systemctl start httpd

          echo "<h1>Hello from Apache Web Server</h1>" > /var/www/html/index.html


  MyTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 80
      Protocol: HTTP
      VpcId: !Ref VPCID

      Targets:
        - Id: !Ref MyWebServer
          Port: 80


  MyALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: my-alb
      Scheme: internet-facing
      Type: application

      Subnets: !Ref Subnets

      SecurityGroups:
        - !Ref sg


  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref MyALB

      Port: 443
      Protocol: HTTPS

      Certificates:
        - CertificateArn: !Ref MyCertificate

      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref MyTargetGroup