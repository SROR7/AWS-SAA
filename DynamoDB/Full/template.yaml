AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Resources:
  myDynamoDBTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableClass: STANDARD
      BillingMode: PROVISIONED

      AttributeDefinitions:
        - AttributeName: Album
          AttributeType: S

        - AttributeName: Artist
          AttributeType: S

        - AttributeName: Sales
          AttributeType: N

        - AttributeName: NumberOfSongs
          AttributeType: N

      KeySchema:
        - AttributeName: Album
          KeyType: HASH

        - AttributeName: Artist
          KeyType: RANGE

      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5

      TableName: myTableName

      GlobalSecondaryIndexes:
        - IndexName: myGSI
          KeySchema:
            - AttributeName: Sales
              KeyType: HASH
            - AttributeName: Artist
              KeyType: RANGE

          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - Album
              - NumberOfSongs

          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5

        - IndexName: myGSI2
          KeySchema:
            - AttributeName: NumberOfSongs
              KeyType: HASH
            - AttributeName: Sales
              KeyType: RANGE

          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - Album
              - Artist

          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5

      LocalSecondaryIndexes:
        - IndexName: myLSI

          KeySchema:
            - AttributeName: Album
              KeyType: HASH
            - AttributeName: Sales
              KeyType: RANGE

          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - Artist
              - NumberOfSongs

      DeletionProtectionEnabled: false