QueryLanguage: JSONata

StartAt: Set Variables and State Output

States:

  Set Variables and State Output:
    Type: Pass
    Next: Is Hello World Example?
    Output:
      IsHelloWorldExample: true
      ExecutionWaitTimeInSeconds: 3
    Assign:
      CheckpointCount: 0

  Is Hello World Example?:
    Type: Choice
    Default: Fail the Execution
    Choices:
      - Next: Wait for X Seconds
        Condition: "{% $states.input.IsHelloWorldExample %}"

  Fail the Execution:
    Type: Fail
    Error: Not a Hello World Example

  Wait for X Seconds:
    Type: Wait
    Seconds: "{% $states.input.ExecutionWaitTimeInSeconds %}"
    Next: Execute in Parallel
    Assign:
      CheckpointCount: "{% $CheckpointCount + 1 %}"

  Execute in Parallel:
    Type: Parallel
    Branches:

      - StartAt: Format Execution Start Date
        States:
          Format Execution Start Date:
            Type: Pass
            Output:
              FormattedExecutionStartDate: >-
                {% $fromMillis($toMillis($states.context.State.EnteredTime), '[M01]/[D01]') %}
            End: true

      - StartAt: Snapshot Execution Elapsed Time
        States:
          Snapshot Execution Elapsed Time:
            Type: Pass
            End: true
            Output:
              ElapsedTimeToSnapshot: >-
                {% ($toMillis($now()) - $toMillis($states.context.Execution.StartTime)) / 1000 %}

    Next: Set Checkpoint

    Catch:
      - ErrorEquals:
          - States.QueryEvaluationError
        Next: Set Checkpoint
        Output:
          ElapsedTimeToSnapshot: Failed to calculate
          FormattedExecutionStartDate: Failed to format

  Set Checkpoint:
    Type: Pass
    Next: Summarize the Execution
    Assign:
      CheckpointCount: "{% $CheckpointCount + 1 %}"

  Summarize the Execution:
    Type: Succeed
    Output:
      Summary: >-
        {% 'This Hello World execution began on ' &
        $states.input.FormattedExecutionStartDate &
        '. The state machine ran for ' &
        $states.input.ElapsedTimeToSnapshot &
        ' seconds before the snapshot was taken, passing through ' &
        $CheckpointCount &
        ' checkpoints, and has successfully completed.' %}