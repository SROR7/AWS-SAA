AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  InLineLamda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: python3.15
      CodeUri: s3://bucket-name/key-name
      InlineCode: "def handler(event, context):\n\nmessage = 'Hello {} {}!'.format(event['frist_name'],\
        \ event['last_name'])\n\nprint(\"print for me <3\")\n\nreturn {\n    'message':\
        \ message\n}"
