AWSTemplateFormatVersion: "2010-09-09"
Description: EC2 with Apache and SSM

Parameters:
  InstanceType:
    Type: String
    Default: t3.micro

  VpcId:
    Type: String
    Default: vpc-0ca79c10ec4123590

  SubnetId:
    Type: String
    Default: subnet-0741dac532f7c1446

  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-0a905b99668efea4b

  SecurityGroupId: 
    Type: String
    Default: sg-0098231e1c473e71e
Resources:

  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      IamInstanceProfile: !Ref InstanceProfile

      Tags:
        - Key: Name
          Value: Apache-WebServer

Outputs:
  InstanceId:
    Value: !Ref WebServer

  PrivateIP:
    Value: !GetAtt WebServer.PrivateIp

  PublicIP:
    Value: !GetAtt WebServer.PublicIp
