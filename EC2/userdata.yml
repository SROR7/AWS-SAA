#cloud-config
package_update: true
package_upgrade: true

packages:
  - httpd

write_files:
  - path: /var/www/html/index.html
    permissions: '0644'
    owner: root:root
    content: |
      <!DOCTYPE html>
      <html>
      <head>
        <title>Cloud-Init Demo</title>
      </head>
      <body>
        <h1>Hello from Cloud-Init!</h1>
        <p>This page was created using the write_files module.</p>
      </body>
      </html>

runcmd:
  - systemctl start httpd
  - systemctl enable httpd
  - systemctl restart httpd